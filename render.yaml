services:
  - name: torat-tsion-api
    type: web
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: TORAT_TSION_DRIVE_FOLDER_ID
        value: 1JZfz7efCHWW8GbjxQ2LOkU7T0ZUy_c8b
      - key: GITHUB_CONTENTS_TOKEN
        sync: false
      - key: GITHUB_CONTENTS_REPOSITORY
        sync: false
      - key: GITHUB_CONTENTS_BRANCH
        value: torat-tsion-content
      - key: YOUTUBE_API_KEY
        sync: false

  - name: torat-tsion-web
    type: web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://torat-tsion-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
