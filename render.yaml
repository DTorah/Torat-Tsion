services:
  - name: torat-tsion-api
    type: web
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free

  - name: torat-tsion-web
    type: web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://torat-tsion-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
